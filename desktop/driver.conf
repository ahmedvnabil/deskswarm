[program:cua-driver]
command=/usr/local/bin/cua-driver serve
user=cua
environment=HOME="/home/cua",DISPLAY=":1",XDG_SESSION_TYPE="x11",XAUTHORITY="/home/cua/.Xauthority",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/bus"
autostart=true
autorestart=true
startsecs=2
priority=40
stdout_logfile=/tmp/cua-driver.log
stderr_logfile=/tmp/cua-driver.err
