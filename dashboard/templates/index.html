<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deskswarm — fleet control</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; }
  .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; }
</style>
</head>
<body class="bg-neutral-950 text-neutral-200 min-h-screen">
  <header class="border-b border-neutral-800 bg-neutral-900/60 px-6 py-3 flex items-center justify-between sticky top-0 z-10 backdrop-blur">
    <div class="flex items-center gap-3">
      <span class="text-lg font-bold text-amber-400">deskswarm</span>
      <span class="text-xs text-neutral-500 mono">self-hosted computer-use agent fleet</span>
    </div>
    <div class="flex items-center gap-4 text-xs text-neutral-500">
      <a href="https://github.com/ahmedvnabil/deskswarm" target="_blank" class="hover:text-amber-400">GitHub</a>
      <span class="mono" id="clock"></span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-8">

    <section>
      <h2 class="text-sm font-semibold text-neutral-400 mb-3 tracking-wide uppercase">Fleet status</h2>
      <div id="fleet-status" hx-get="/partials/fleet" hx-trigger="load, every 5s" hx-swap="innerHTML">
        <div class="text-neutral-600 text-sm">loading...</div>
      </div>
    </section>

    <section class="bg-neutral-900 border border-neutral-800 rounded-lg p-5">
      <h2 class="text-sm font-semibold text-neutral-400 mb-3 tracking-wide uppercase">New task</h2>
      <form hx-post="/api/v1/tasks" hx-target="#submit-result" hx-swap="innerHTML"
            hx-on::after-request="if(event.detail.successful){ this.reset(); htmx.trigger('#task-log','refresh'); htmx.trigger('#analytics','refresh'); }"
            class="space-y-3">
        <div class="flex gap-3 flex-wrap items-start">
          <select name="desktop" class="bg-neutral-950 border border-neutral-700 rounded px-3 py-2 text-sm">
            <option value="all">whole fleet (parallel)</option>
            {% for d in fleet %}
            <option value="{{ d.name }}">{{ d.name }}</option>
            {% endfor %}
          </select>
          <textarea name="description" required placeholder="Describe the task... e.g. open a browser and search for today's top news"
            class="flex-1 min-w-[300px] bg-neutral-950 border border-neutral-700 rounded px-3 py-2 text-sm h-20"></textarea>
          <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-neutral-950 font-semibold px-5 py-2 rounded text-sm self-start">
            Run
          </button>
        </div>
        <div id="submit-result" class="text-xs text-neutral-500"></div>
      </form>
    </section>

    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-neutral-400 tracking-wide uppercase">Analytics</h2>
        <span class="text-xs text-neutral-600">refreshes every 10s</span>
      </div>
      <div id="analytics" hx-get="/partials/analytics" hx-trigger="load, every 10s, refresh" hx-swap="innerHTML">
        <div class="text-neutral-600 text-sm">loading...</div>
      </div>
    </section>

    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-neutral-400 tracking-wide uppercase">Live view</h2>
        <span class="text-xs text-neutral-600">click a desktop to embed its live screen</span>
      </div>
      <div id="live-view" hx-get="/partials/live" hx-trigger="load" hx-swap="innerHTML">
        <div class="text-neutral-600 text-sm">loading...</div>
      </div>
    </section>

    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-neutral-400 tracking-wide uppercase">Task log / reports</h2>
        <div class="flex items-center gap-3">
          <a href="/api/v1/tasks/export.csv" class="text-xs bg-neutral-800 hover:bg-neutral-700 px-3 py-1.5 rounded">
            export CSV
          </a>
          <span class="text-xs text-neutral-600">refreshes every 4s</span>
        </div>
      </div>
      <div id="task-log" hx-get="/partials/tasks" hx-trigger="load, every 4s, refresh" hx-swap="innerHTML">
        <div class="text-neutral-600 text-sm">loading...</div>
      </div>
    </section>

  </main>

  <script>
    function tick(){
      document.getElementById('clock').textContent = new Date().toLocaleString('en-GB', { timeZone: 'UTC' }) + ' UTC';
    }
    tick(); setInterval(tick, 1000);

    let dailyChart = null;
    function renderDailyChart(labels, counts, costs){
      const canvas = document.getElementById('daily-chart');
      if(!canvas) return;
      if(dailyChart) dailyChart.destroy();
      dailyChart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: 'tasks', data: counts, backgroundColor: '#f59e0b', yAxisID: 'y' },
            { label: 'cost (USD)', data: costs, type: 'line', borderColor: '#34d399', backgroundColor: '#34d399', yAxisID: 'y1', tension: 0.3 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { position: 'left', ticks: { color: '#a3a3a3' }, grid: { color: '#262626' }, title: { display: true, text: 'tasks', color: '#a3a3a3' } },
            y1: { position: 'right', ticks: { color: '#a3a3a3' }, grid: { display: false }, title: { display: true, text: 'USD', color: '#a3a3a3' } },
            x: { ticks: { color: '#a3a3a3' }, grid: { display: false } }
          },
          plugins: { legend: { labels: { color: '#d4d4d4' } } }
        }
      });
    }
  </script>
</body>
</html>
