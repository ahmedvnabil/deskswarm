<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
  {% for d in fleet %}
  <div class="bg-neutral-900 border border-neutral-800 rounded-lg overflow-hidden">
    <button type="button"
      data-novnc-url="{{ d.novnc_url }}"
      data-target="live-frame-{{ d.name }}"
      onclick="toggleLive(this)"
      class="w-full flex items-center justify-between px-4 py-2 text-sm hover:bg-neutral-800/60">
      <span class="font-semibold">{{ d.name }}</span>
      <span class="text-xs text-neutral-500 live-toggle-label">click to embed live view</span>
    </button>
    <div id="live-frame-{{ d.name }}" class="hidden" style="aspect-ratio: 16/10; background: #000;"></div>
  </div>
  {% endfor %}
</div>

<script>
  function toggleLive(btn) {
    const container = document.getElementById(btn.dataset.target);
    const label = btn.querySelector('.live-toggle-label');
    if (!container) return;

    if (container.dataset.loaded !== '1') {
      const iframe = document.createElement('iframe');
      iframe.src = btn.dataset.novncUrl;
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = '0';
      container.appendChild(iframe);
      container.dataset.loaded = '1';
    }

    const hidden = container.classList.toggle('hidden');
    label.textContent = hidden ? 'click to embed live view' : 'click to hide';
  }
</script>
