name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        working-directory: dashboard-ts
        run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloudflare edge integration (local workerd)
        working-directory: dashboard-ts
        run: bun run test:cloudflare-edge
      - name: Typecheck
        working-directory: dashboard-ts
        run: bunx tsc --noEmit
      - name: Test
        working-directory: dashboard-ts
        # The suite stubs Docker and Driver, so it needs neither a daemon
        # nor a desktop.
        run: bun test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the dashboard image
        run: docker build -t deskswarm-dashboard:ci dashboard-ts
      - name: Build the native desktop image
        run: docker build -t deskswarm-desktop:ci desktop
      - name: Compose config is valid
        run: |
          cp .env.example .env
          docker compose config >/dev/null
