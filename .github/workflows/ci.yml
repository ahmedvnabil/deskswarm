name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install dependencies
        working-directory: dashboard-ts
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: dashboard-ts
        run: bunx tsc --noEmit
      - name: Test
        working-directory: dashboard-ts
        # The suite stubs Docker and the bridge, so it needs neither a daemon
        # nor a desktop.
        run: bun test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the dashboard image
        run: docker build -t deskswarm-dashboard:ci dashboard-ts
      - name: Build the bridge image
        run: docker build -t deskswarm-bridge:ci bridge
      - name: Compose config is valid
        run: |
          cp .env.example .env
          docker compose config >/dev/null
