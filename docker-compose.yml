# Fixed project name so the network is 'deskswarm_default' whatever the
# directory is called — a GitHub zip unpacks to deskswarm-main, and a
# hard-coded network name would then point at one that doesn't exist.
name: deskswarm

services:

  dashboard:
    # The Bun/Hono dashboard. The original Flask one is still in ./dashboard —
    # point this at it to switch back; the database and every container it
    # manages are the same.
    build: ./dashboard-ts
    environment:
      PORT: 7000
      # Only needed for agent tasks — machines, screens, files, clipboard,
      # sleep/wake, backups and shares all work without any model at all.
      DESKSWARM_MODEL: ${DESKSWARM_MODEL:-}
      DESKSWARM_API_BASE: ${DESKSWARM_API_BASE:-}
      DESKSWARM_API_KEY: ${DESKSWARM_API_KEY:-}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      # Leave empty: screen links follow whatever hostname you opened the
      # dashboard with. Only set it if that differs (a reverse proxy).
      DESKSWARM_PUBLIC_HOST: ${DESKSWARM_PUBLIC_HOST:-}
      DESKSWARM_NOVNC_PORT_BASE: ${DESKSWARM_NOVNC_PORT_BASE:-6901}
      # Which interface a machine's screen is published on. Empty publishes it
      # on all of them, which is right on a LAN. Set to 127.0.0.1 on a public
      # host — ufw does not govern Docker's published ports, so binding is the
      # control that actually keeps them off the internet.
      DESKSWARM_SCREEN_BIND: ${DESKSWARM_SCREEN_BIND:-}
      # Reach screens through the dashboard's own origin at /screen/<port>/
      # rather than at host:port. Needed on an HTTPS site: a browser refuses an
      # http:// frame inside an https:// page.
      DESKSWARM_SCREEN_PROXY: ${DESKSWARM_SCREEN_PROXY:-}
      # Session length, and the login lockout.
      DESKSWARM_SESSION_HOURS: ${DESKSWARM_SESSION_HOURS:-336}
      DESKSWARM_LOGIN_ATTEMPTS: ${DESKSWARM_LOGIN_ATTEMPTS:-8}
      DESKSWARM_LOGIN_LOCKOUT_MINUTES: ${DESKSWARM_LOGIN_LOCKOUT_MINUTES:-15}
      DESKSWARM_ADMIN_USER: ${DESKSWARM_ADMIN_USER:-}
      DESKSWARM_ADMIN_PASSWORD: ${DESKSWARM_ADMIN_PASSWORD:-}
      # Set to 1 on hosts that can't apply AppArmor profiles (Proxmox LXC).
      DESKSWARM_DISABLE_APPARMOR: ${DESKSWARM_DISABLE_APPARMOR:-}
      # Leave empty: the dashboard detects the network it is on. Only set
      # this if you attach it to a network of your own.
      DESKSWARM_NETWORK: ${DESKSWARM_NETWORK:-}
      # Rows per page in the task log, and the ceiling on one {1..N} batch.
      DESKSWARM_PAGE_SIZE: ${DESKSWARM_PAGE_SIZE:-25}
      # Seconds a wall screenshot is cached before a fresh frame is pulled.
      DESKSWARM_SHOT_TTL: ${DESKSWARM_SHOT_TTL:-6}
      DESKSWARM_MAX_BULK_CREATE: ${DESKSWARM_MAX_BULK_CREATE:-25}
      DESKSWARM_TASK_TIMEOUT: ${DESKSWARM_TASK_TIMEOUT:-300}
      DESKSWARM_MAX_CONCURRENT_TASKS: ${DESKSWARM_MAX_CONCURRENT_TASKS:-8}
      # Guards — see .env.example for what each one catches.
      DESKSWARM_DAILY_COST_LIMIT: ${DESKSWARM_DAILY_COST_LIMIT:-0}
      DESKSWARM_MACHINE_MB: ${DESKSWARM_MACHINE_MB:-400}
      DESKSWARM_MIN_FREE_MB: ${DESKSWARM_MIN_FREE_MB:-512}
      DESKSWARM_MEMORY_BUDGET_MB: ${DESKSWARM_MEMORY_BUDGET_MB:-0}
      DESKSWARM_PERSIST_HOME: ${DESKSWARM_PERSIST_HOME:-1}
      DESKSWARM_MAX_UPLOAD_MB: ${DESKSWARM_MAX_UPLOAD_MB:-64}
      DESKSWARM_MIN_FREE_DISK_GB: ${DESKSWARM_MIN_FREE_DISK_GB:-5}
      DESKSWARM_LOW_DISK_WARN_GB: ${DESKSWARM_LOW_DISK_WARN_GB:-15}
      DESKSWARM_FAILURE_BREAKER: ${DESKSWARM_FAILURE_BREAKER:-5}
      DESKSWARM_BREAKER_COOLDOWN_MIN: ${DESKSWARM_BREAKER_COOLDOWN_MIN:-10}
      # Per-machine caps, so one runaway machine can't starve the rest.
      DESKSWARM_MACHINE_MEM_LIMIT: ${DESKSWARM_MACHINE_MEM_LIMIT:-2g}
      DESKSWARM_MACHINE_CPUS: ${DESKSWARM_MACHINE_CPUS:-2}
      DESKSWARM_MACHINE_PIDS: ${DESKSWARM_MACHINE_PIDS:-512}
      DESKSWARM_BRIDGE_MEM_LIMIT: ${DESKSWARM_BRIDGE_MEM_LIMIT:-512m}
      # Sleep machines nobody is using. 0 = never (see .env.example).
      DESKSWARM_IDLE_SUSPEND_MINUTES: ${DESKSWARM_IDLE_SUSPEND_MINUTES:-0}
      DESKSWARM_WAKE_TIMEOUT: ${DESKSWARM_WAKE_TIMEOUT:-45}
      DESKSWARM_MAX_CLIPBOARD_KB: ${DESKSWARM_MAX_CLIPBOARD_KB:-256}
      # Backups of each machine's home, kept on the dashboard's data volume.
      DESKSWARM_BACKUP_DIR: ${DESKSWARM_BACKUP_DIR:-/app/data/backups}
      DESKSWARM_BACKUP_KEEP: ${DESKSWARM_BACKUP_KEEP:-5}
      DESKSWARM_BACKUP_DAILY_AT: ${DESKSWARM_BACKUP_DAILY_AT:-}
      # Share links and the audit trail.
      DESKSWARM_SHARE_DEFAULT_HOURS: ${DESKSWARM_SHARE_DEFAULT_HOURS:-24}
      DESKSWARM_SHARE_MAX_HOURS: ${DESKSWARM_SHARE_MAX_HOURS:-720}
      DESKSWARM_AUDIT_RETENTION_DAYS: ${DESKSWARM_AUDIT_RETENTION_DAYS:-90}
    ports:
      - "${DASHBOARD_PORT:-7861}:7000"
    volumes:
      - deskswarm_data:/app/data
      # The dashboard creates and destroys desktop containers on demand.
      - /var/run/docker.sock:/var/run/docker.sock
      # Build context for the bridge image, built on first use.
      - ./bridge:/bridge-src:ro
    restart: unless-stopped

volumes:
  deskswarm_data:
